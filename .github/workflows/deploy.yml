name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          # Folder tujuan di hosting. Default cPanel: ./public_html/
          # Bisa dioverride lewat repository variable FTP_DIR tanpa mengubah workflow.
          server-dir: ${{ vars.FTP_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
